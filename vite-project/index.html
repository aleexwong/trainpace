<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme before first paint, so a dark-mode visitor never sees a white
         flash. Mirrors src/features/theme/theme.ts (storage key +
         LIGHT_ONLY_ROUTES); keep the two in sync. -->
    <script>
      (function () {
        var p = null;
        try {
          p = localStorage.getItem("tp-theme");
        } catch (e) {}
        var dark =
          p === "dark" ||
          (p !== "light" &&
            !!window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var path = location.pathname;
        var lightOnly = [].some(function (r) {
          return path === r || path.indexOf(r + "/") === 0;
        });
        if (dark && !lightOnly) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Train Pace" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Brand fonts: DM Sans (body) + Space Grotesk (headings).
         The DM Sans `1,...` axis loads the real italic face — `font-synthesis: none`
         in index.css means dropping it leaves italic text rendering upright. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=Space+Grotesk:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- SEO tags are injected by prerender.jsx during build -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
