name: SEO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  seo-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vite-project/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails on states that are never acceptable (duplicate metadata, broken
      # internal links, sitemap/robots contradictions) and on any rise above
      # the ratcheted counts in scripts/seo-baseline.json.
      - name: SEO check
        run: npm run seo-check
